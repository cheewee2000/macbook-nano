name: MacbookNano
options:
  bundleIdPrefix: com.cwandt
  deploymentTarget:
    iOS: "18.0"
packages:
  # MIT. Pinned by revision: its CryptoSwift dependency is a branch, which SwiftPM only allows under a revision pin.
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc
    revision: 090b96eddeee183e9fec293c5cd881d302a4349d
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  MacbookNano:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AppIcon.icon
        buildPhase: resources
      - path: fonts/SpaceMono-Regular.ttf
        buildPhase: resources
    dependencies:
      - package: RoyalVNCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.macbooknano
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L6DVQR8JB9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Macbook Nano
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to Screen Sharing on your Mac.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  MacbookNanoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MacbookNano
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: L6DVQR8JB9
  MacbookNanoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MacbookNano
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: L6DVQR8JB9
schemes:
  MacbookNano:
    build:
      targets:
        MacbookNano: all
    test:
      targets: [MacbookNanoTests, MacbookNanoUITests]
